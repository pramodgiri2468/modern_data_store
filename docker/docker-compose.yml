version: '3.8'

services:
  mongo1:
    image: mongo:7.0
    container_name: iothings-mongo1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    networks:
      - iothings-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo2:
    image: mongo:7.0
    container_name: iothings-mongo2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
    networks:
      - iothings-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo3:
    image: mongo:7.0
    container_name: iothings-mongo3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
    networks:
      - iothings-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:7.0
    container_name: iothings-mongo-init
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    networks:
      - iothings-net
    restart: "no"
    entrypoint: >
      bash -c "
      echo 'Waiting for replica set members...';
      sleep 3;
      mongosh --host mongo1:27017 --eval '
        try {
          const status = rs.status();
          print(\"Replica set already initialized: \" + status.set);
        } catch (e) {
          print(\"Initiating 3-node replica set rs0...\");
          rs.initiate({
            _id: \"rs0\",
            members: [
              { _id: 0, host: \"mongo1:27017\", priority: 2 },
              { _id: 1, host: \"mongo2:27017\", priority: 1 },
              { _id: 2, host: \"mongo3:27017\", priority: 1 }
            ]
          });
        }
      ';
      echo 'Replica set configuration completed.';
      "

  iothings-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: iothings-core-server
    ports:
      - "3000:3000"
      - "1883:1883"
    environment:
      - PORT=3000
      - MQTT_PORT=1883
      - MONGO_URI=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/iothings_gate?replicaSet=rs0&readPreference=primaryPreferred
    depends_on:
      - mongo-init
    networks:
      - iothings-net

networks:
  iothings-net:
    driver: bridge

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
